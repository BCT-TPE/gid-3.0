<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giant ID</title>
<meta name="description" content="Giant ID sign-in — Google-compliant redesign prototype (RWD, zh / en).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&family=Open+Sans:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pearl:#f2f2f5; --white:#fff; --black:#000; --charcoal:#222020;
    --platinum:#dedee0; --silver:#abb0b6; --blue-night:#5a6d96;
    --primary-blue:#0050fc; --text-secondary:#353f58;
    --font-action:"Overpass","Noto Sans TC","Noto Sans",Arial,sans-serif;
    --font-body:"Open Sans","Noto Sans TC","Noto Sans",Arial,sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{font-family:var(--font-body); color:var(--charcoal); -webkit-font-smoothing:antialiased;}

  /* ---------- page / background ---------- */
  .page{position:relative; min-height:100vh; min-height:100dvh; background:var(--white); overflow:auto;}
  .bg{display:none;}
  .wrap{position:relative; z-index:1; min-height:100vh; min-height:100dvh; display:flex; align-items:stretch; justify-content:center;}

  /* ---------- card ---------- */
  .card{
    display:flex; flex-direction:column; width:100%; background:var(--white);
    min-height:100vh; min-height:100dvh;
  }
  .card-head{padding:48px 32px 0;}
  .brand{height:16px; width:330px; max-width:100%; display:block;}
  .title{
    margin-top:26px; font-family:var(--font-action); font-weight:800;
    font-size:30px; line-height:1.15; letter-spacing:-0.5px; color:var(--black);
  }
  .subtitle{
    margin-top:8px; font-family:var(--font-action); font-weight:800;
    font-size:22px; line-height:1.3; color:var(--black);
  }
  .purpose{
    margin-top:14px; font-family:var(--font-body); font-weight:400;
    font-size:14px; line-height:20px; color:var(--text-secondary);
  }

  /* mobile bottom padding reserves room so the fixed language toggle (bottom-left)
     and chat button (bottom-right) never cover the pinned footer text */
  .card-body{flex:1; display:flex; flex-direction:column; padding:36px 32px 96px;}

  /* ---------- form ---------- */
  .field-label{display:block; font-family:var(--font-body); font-weight:700; font-size:14px; line-height:20px; color:var(--charcoal); margin-bottom:4px;}
  .field{
    height:40px; width:100%; border:1px solid var(--platinum); border-radius:4px;
    background:var(--white); padding:8px 12px; font-family:var(--font-body);
    font-size:14px; line-height:20px; color:var(--charcoal); outline:none;
  }
  .field::placeholder{color:var(--silver);}
  .field:focus{border-color:var(--primary-blue);}
  .field:focus{caret-color:var(--primary-blue);}

  .form-row{margin-top:28px; display:flex; align-items:center; justify-content:space-between;}
  .btn-text{
    font-family:var(--font-action); font-weight:800; font-size:14px; line-height:16px;
    color:var(--black); background:none; border:none; cursor:pointer;
    min-height:40px; padding:12px 0; display:flex; align-items:center; text-decoration:none;
  }
  .btn-primary{
    font-family:var(--font-action); font-weight:800; font-size:14px; line-height:16px;
    color:var(--white); background:var(--black); border:none; cursor:pointer;
    min-height:40px; width:156px; border-radius:24px; padding:12px 16px;
    display:flex; align-items:center; justify-content:center;
  }
  .btn-primary:active{background:#686868;}

  /* ---------- divider ---------- */
  .divider{display:flex; align-items:center; gap:16px; margin:44px 0 20px; color:var(--blue-night);}
  .divider::before,.divider::after{content:""; flex:1; height:1px; background:var(--platinum);}
  .divider span{font-family:var(--font-body); font-size:14px; line-height:20px; color:var(--blue-night);}

  /* ---------- social (mobile: icon-only row / desktop: labeled column) ---------- */
  .social{display:flex; flex-direction:row; gap:12px;}
  .social-btn{
    display:flex; align-items:center; justify-content:center; gap:12px;
    flex:1 1 0; min-width:0; min-height:48px;
    border:1px solid var(--platinum); border-radius:24px;
    background:var(--white); padding:12px 16px; cursor:pointer;
  }
  .social-btn:active{border-color:var(--silver);}
  .social-btn .ic{width:16px; height:16px; display:flex; align-items:center; justify-content:center; flex:0 0 16px;}
  .social-btn .ic img{width:16px; height:16px; display:block;}
  .social-btn .lbl{display:none;}
  .social-btn span.lbl{
    font-family:var(--font-action); font-weight:600; font-size:14px; line-height:16px;
    color:var(--black); transform:translateY(1px);
  }

  /* ---------- footer ---------- */
  .foot-group{margin-top:auto;}  /* mobile: pin to bottom of full-height card */
  .foot{margin-top:40px; display:flex; align-items:center; justify-content:space-between;}
  .contact{display:flex; align-items:center; gap:6px; font-family:var(--font-body); font-size:14px; color:var(--black);}
  .contact svg{display:block;}
  .privacy{font-family:var(--font-body); font-size:14px; color:var(--primary-blue); text-decoration:underline; cursor:pointer;}
  .disclaimer{
    margin-top:16px; padding-top:16px; border-top:1px solid var(--platinum);
    font-family:var(--font-body); font-size:12px; line-height:18px; color:var(--text-secondary);
  }

  /* ---------- chatbot FAB ---------- */
  .fab{
    position:fixed; right:16px; bottom:16px; width:60px; height:60px; border-radius:50%;
    background:var(--white); border:1.5px solid var(--platinum);
    box-shadow:0 8px 16px rgba(0,0,0,0.09); display:flex; align-items:center; justify-content:center;
    z-index:20; cursor:pointer;
  }
  .fab img{width:19px; height:19px; display:block;}

  /* ---------- language toggle (prototype control) ---------- */
  .lang{
    position:fixed; bottom:16px; left:16px; z-index:30; display:flex;
    background:rgba(255,255,255,0.92); border:1px solid var(--platinum);
    border-radius:20px; overflow:hidden; backdrop-filter:blur(4px);
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
  }
  .lang button{
    font-family:var(--font-action); font-weight:800; font-size:12px; line-height:1;
    padding:7px 14px; border:none; background:none; color:var(--charcoal); cursor:pointer;
  }
  .lang button.active{background:var(--black); color:var(--white);}

  /* ---------- desktop ---------- */
  @media (min-width:1024px){
    .page{background:var(--pearl);}
    .bg{display:block; position:fixed; inset:0; width:100%; height:100%;
        object-fit:cover; object-position:bottom; pointer-events:none; z-index:0;}
    .wrap{align-items:center; justify-content:flex-end; padding:24px 13.25vw;}
    .card{
      min-height:0; max-width:680px; border-radius:16px;
      box-shadow:0 8px 32px rgba(0,0,0,0.09);
    }
    .card-head{padding:44px 64px 0;}
    .title{margin-top:18px; font-size:36px; line-height:1.15; letter-spacing:-0.72px;}
    .subtitle{margin-top:6px;}
    .purpose{margin-top:10px;}
    .card-body{padding:24px 64px 44px;}
    .form-row{margin-top:20px;}
    .divider{margin:20px 0 16px;}
    .social{flex-direction:column; gap:10px;}
    .social-btn{flex:0 0 auto; width:100%;}
    .social-btn .lbl{display:inline;}
    .foot-group{margin-top:0;}
    .foot{margin-top:24px;}
    .disclaimer{margin-top:12px; padding-top:12px;}
  }
</style>
</head>
<body>
  <!-- language toggle: prototype control only, not part of the real page -->
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="zh" class="active">繁中</button>
    <button type="button" data-lang="en">EN</button>
  </div>

  <main class="page">
    <img class="bg" src="assets/gid-sign-in/login-bg.jpg" alt="">
    <div class="wrap">
      <section class="card">
        <div class="card-head">
          <img class="brand" src="assets/gid-sign-in/brand-lockup.svg" alt="Giant Liv Momentum Cadex">
          <h1 class="title" data-i18n="title">Giant ID</h1>
          <p class="subtitle" data-i18n="subtitle">享受 Giant 騎乘世界</p>
          <p class="purpose" data-i18n="purpose">Giant ID 是您使用 Giant 各項服務的帳號，讓您集中管理個人資料、聯絡資訊與登入安全設定。</p>
        </div>

        <div class="card-body">
          <form novalidate autocomplete="off" onsubmit="return false">
            <label class="field-label" data-i18n="label" for="account">手機號碼或電子信箱</label>
            <input id="account" class="field" type="text" name="account"
                   data-i18n-ph="placeholder" placeholder="手機號碼或電子信箱">
            <div class="form-row">
              <a class="btn-text" href="#" data-i18n="signup">帳號註冊</a>
              <button class="btn-primary" type="submit" data-i18n="next">下一步</button>
            </div>
          </form>

          <div class="divider"><span data-i18n="or">或</span></div>

          <div class="social">
            <button class="social-btn" type="button">
              <span class="ic"><img src="assets/gid-sign-in/social-apple.svg" alt=""></span>
              <span class="lbl" data-i18n="apple">Apple ID 登入</span>
            </button>
            <button class="social-btn" type="button">
              <span class="ic"><img src="assets/gid-sign-in/social-google.svg" alt=""></span>
              <span class="lbl" data-i18n="google">Google 登入</span>
            </button>
            <button class="social-btn" type="button">
              <span class="ic"><img src="assets/gid-sign-in/social-facebook.svg" alt=""></span>
              <span class="lbl" data-i18n="facebook">Facebook 登入</span>
            </button>
            <button class="social-btn" type="button">
              <span class="ic"><img src="assets/gid-sign-in/social-line.svg" alt=""></span>
              <span class="lbl" data-i18n="line">LINE 登入</span>
            </button>
          </div>

          <div class="foot-group">
            <div class="foot">
              <span class="contact">
                <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round">
                  <rect x="1.5" y="3.25" width="13" height="9.5" rx="1.5"/>
                  <path d="M2.2 4.2 8 8.4l5.8-4.2"/>
                </svg>
                <span data-i18n="contact">聯絡我們</span>
              </span>
              <a class="privacy" href="#" data-i18n="privacy">隱私權政策</a>
            </div>
            <p class="disclaimer" data-i18n="disclaimer">使用 Google 登入時，Giant ID 會取得您的基本個人資料與電子郵件地址，用於建立帳號與識別身分。</p>
          </div>
        </div>
      </section>
    </div>
  </main>

  <button class="fab" type="button" aria-label="Chat">
    <img src="assets/gid-sign-in/chatbot.svg" alt="">
  </button>

<script>
  var I18N = {
    zh: {
      title:'Giant ID',
      subtitle:'享受 Giant 騎乘世界',
      purpose:'Giant ID 是您使用 Giant 各項服務的帳號，讓您集中管理個人資料、聯絡資訊與登入安全設定。',
      label:'手機號碼或電子信箱',
      placeholder:'手機號碼或電子信箱',
      signup:'帳號註冊',
      next:'下一步',
      or:'或',
      apple:'Apple ID 登入',
      google:'Google 登入',
      facebook:'Facebook 登入',
      line:'LINE 登入',
      contact:'聯絡我們',
      privacy:'隱私權政策',
      disclaimer:'使用 Google 登入時，Giant ID 會取得您的基本個人資料與電子郵件地址，用於建立帳號與識別身分。'
    },
    en: {
      title:'Giant ID',
      subtitle:'Enjoy Giant Cycling World',
      purpose:'Giant ID is your single account for all Giant services, letting you manage your personal profile, contact details, and sign-in security in one place.',
      label:'Phone number or email',
      placeholder:'Phone number or email',
      signup:'Sign up',
      next:'Next',
      or:'OR',
      apple:'Login with Apple ID',
      google:'Login with Google',
      facebook:'Login with Facebook',
      line:'Login with LINE',
      contact:'Contact us',
      privacy:'Privacy Policy',
      disclaimer:'When you sign in with Google, Giant ID receives your basic profile information and email address to create your account and verify your identity.'
    }
  };

  function setLang(lang){
    var dict = I18N[lang]; if(!dict) return;
    document.documentElement.lang = (lang === 'zh') ? 'zh-Hant' : 'en';
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var k = el.getAttribute('data-i18n'); if(dict[k] != null) el.textContent = dict[k];
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(function(el){
      var k = el.getAttribute('data-i18n-ph'); if(dict[k] != null) el.setAttribute('placeholder', dict[k]);
    });
    document.querySelectorAll('.lang button').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-lang') === lang);
    });
  }

  document.querySelectorAll('.lang button').forEach(function(b){
    b.addEventListener('click', function(){ setLang(b.getAttribute('data-lang')); });
  });

  setLang('zh');
</script>
</body>
</html>
